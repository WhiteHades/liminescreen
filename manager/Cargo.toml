[package]
name = "liminescreenctl"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Native installer and recovery tool for liminescreen"
repository = "https://github.com/WhiteHades/liminescreen"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
